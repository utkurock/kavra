<!doctype html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>obTitle</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { max-width: 680px; margin: 0 auto; padding: 40px 16px 80px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 28px; }
  .steps span { position: relative; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
  .steps span::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--hue-1), var(--hue-2));
    transform: scaleX(0); transform-origin: left; transition: transform .6s cubic-bezier(.2, .7, .2, 1); }
  .steps span.filled::after { transform: scaleX(1); }
  .step { display: flex; flex-direction: column; gap: 18px; }
  .step h1 { font-size: 30px; font-weight: 650; letter-spacing: -.025em; line-height: 1.15; }
  .step h2 { font-size: 24px; font-weight: 650; letter-spacing: -.02em; }
  .step h1:focus, .step h2:focus { outline: none; }
  .lead { color: var(--muted); font-size: 15.5px; max-width: 56ch; }
  .features { display: grid; gap: 10px; }
  .feature { display: flex; gap: 14px; align-items: center; padding: 12px 16px; transition: border-color .2s, transform .2s; }
  .feature:hover { border-color: var(--line-strong); transform: translateY(-1px); }
  .feature-icon { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; }
  .feature-icon svg { width: 18px; height: 18px; }

  /* background light that drifts slowly behind everything */
  body::before { content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
    background: radial-gradient(40% 35% at 20% 10%, rgba(255, 213, 74, .07), transparent 70%),
                radial-gradient(45% 40% at 85% 25%, rgba(127, 219, 255, .08), transparent 70%);
    animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate3d(4%, 6%, 0) scale(1.05); } }

  /* every visible step's children rise in one after another */
  .step:not([hidden]) > * { animation: rise .55s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
  .features .feature, ol.howto li, .grid .choice { animation: rise .5s cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: calc(var(--i, 0) * 60ms + 180ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* demo player on the welcome step */
  .demo { position: relative; aspect-ratio: 16 / 8.2; border-radius: 18px; overflow: hidden; border: 1px solid var(--line-strong);
    background: #07070a; box-shadow: 0 30px 80px -30px rgba(127, 219, 255, .25); }
  .demo-scene { position: absolute; inset: 0; background: linear-gradient(160deg, #1b1f3d 0%, #0d0f1d 55%, #120c18 100%); }
  .demo-scene span { position: absolute; border-radius: 50%; filter: blur(40px); opacity: .55; }
  .demo-scene .a { width: 46%; height: 70%; left: 8%; top: 4%; background: #3c4bb8; animation: float 9s ease-in-out infinite alternate; }
  .demo-scene .b { width: 38%; height: 60%; right: 6%; top: 18%; background: #7a3d74; animation: float 11s ease-in-out infinite alternate-reverse; }
  .demo-scene .c { width: 30%; height: 40%; left: 40%; bottom: 10%; background: #1d6f86; animation: float 13s ease-in-out infinite alternate; }
  @keyframes float { to { transform: translate3d(12%, 8%, 0) scale(1.12); } }
  .demo-subs { position: absolute; left: 0; right: 0; bottom: 52px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 0 20px; font-weight: 600; text-align: center; transition: opacity .4s; }
  .demo-subs.out { opacity: 0; }
  .demo-line { padding: 2px 10px; border-radius: 6px; background: rgba(0, 0, 0, .72); line-height: 1.4; }
  .demo-line:empty { display: none; }
  .demo-line.orig { font-size: clamp(15px, 2.6vw, 19px); color: #fff; }
  .demo-line.trans { font-size: clamp(13px, 2.2vw, 16px); font-weight: 500; color: #f2f2f2; opacity: 0;
    filter: blur(6px); transition: opacity .35s, filter .45s; }
  .demo-line.trans.shown { opacity: 1; }
  .demo-line.trans.revealed { filter: none; }
  .demo .chunk { display: inline-block; white-space: pre; opacity: 0; transform: translateY(6px);
    transition: opacity .35s, transform .35s; transition-delay: var(--d, 0ms); }
  .demo-line.shown .chunk { opacity: 1; transform: none; }
  .demo-cursor { position: absolute; left: 0; top: 0; width: 18px; height: 18px; color: #fff; filter: drop-shadow(0 1px 2px #000);
    transition: transform .8s cubic-bezier(.4, 0, .2, 1), opacity .3s; opacity: 0; }
  .demo-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    background: linear-gradient(transparent, rgba(0, 0, 0, .7)); color: #cfd0db; font-size: 12px; font-variant-numeric: tabular-nums; }
  .demo-bar svg { width: 12px; height: 12px; }
  .demo-track { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .18); overflow: hidden; }
  .demo-track span { display: block; height: 100%; width: 0; background: #fff; animation: playhead 24s linear infinite; }
  @keyframes playhead { to { width: 100%; } }
  .demo-badge { position: absolute; top: 14px; left: 14px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 999px; background: rgba(0, 0, 0, .55); border: 1px solid rgba(255, 255, 255, .12); font-size: 12px; color: #ececf2; }
  .demo-badge img { width: 14px; height: 14px; }
  .demo-badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft);
    animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(95, 214, 138, 0); } }

  /* primary "next" buttons nudge their arrow on hover */
  .nav .btn.primary[data-next]::after, #finish::after { content: "→"; transition: transform .2s; }
  .nav .btn.primary[data-next]:hover::after, #finish:hover::after { transform: translateX(3px); }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .choice { transition: border-color .15s, box-shadow .15s, transform .15s; }
  .choice:active { transform: scale(.98); }
  .key-status.ok::before { content: "✓ "; }
  .key-status.ok, .key-status.bad { animation: rise .3s ease both; }
  .field-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid { display: grid; gap: 10px; }
  .grid.levels { grid-template-columns: repeat(3, 1fr); }
  .grid.providers { grid-template-columns: repeat(3, 1fr); }
  .grid.modes { grid-template-columns: repeat(3, 1fr); }
  .choice { position: relative; display: block; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 12px;
    background: var(--surface); cursor: pointer; }
  .choice:hover { border-color: var(--faint); }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice strong { display: block; font-size: 14.5px; }
  .choice span { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .choice code { font-size: 11.5px; color: var(--faint); }
  .choice:has(input:checked) { border-color: var(--hue-2); box-shadow: inset 0 0 0 1px var(--hue-2); }
  .choice:has(input:focus-visible) { outline: 2px solid var(--hue-2); outline-offset: 2px; }
  .key-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .key-status { font-size: 13px; }
  .key-status.ok { color: var(--ok); }
  .key-status.bad { color: var(--bad); }
  ol.howto { margin: 0; padding: 0; list-style: none; counter-reset: n; display: grid; gap: 10px; }
  ol.howto li { counter-increment: n; display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; }
  ol.howto li::before { content: counter(n); flex: none; display: grid; place-items: center; width: 26px; height: 26px;
    border-radius: 8px; background: var(--surface-3); font-weight: 700; font-size: 13px; }
  .nav { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .nav .spacer { flex: 1; }
  .error-text { color: var(--bad); font-size: 13px; }
  .finish { text-align: center; align-items: center; padding: 40px 0; }
  .finish-mark { position: relative; width: 88px; height: 88px; }
  .finish-mark svg { width: 100%; height: 100%; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .finish-mark .ring { stroke: url(#ringGradient); stroke-width: 4; stroke-dasharray: 214; stroke-dashoffset: 214; animation: draw .8s .1s ease forwards; }
  .finish-mark .tick { stroke: var(--fg); stroke-width: 5; stroke-dasharray: 50; stroke-dashoffset: 50; animation: draw .45s .75s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .burst i { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: var(--c);
    animation: burst .9s .7s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes burst { from { transform: rotate(var(--a)) translateY(0) scale(1); opacity: 1; }
    to { transform: rotate(var(--a)) translateY(calc(-1 * var(--r))) scale(.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .finish-mark .ring, .finish-mark .tick { stroke-dashoffset: 0; }
    .demo .chunk, .demo-line.trans { opacity: 1; transform: none; filter: none; }
    .burst { display: none; }
  }
  @media (max-width: 600px) {
    .two, .grid.levels, .grid.providers, .grid.modes { grid-template-columns: 1fr 1fr; }
    .grid.modes { grid-template-columns: 1fr; }
  }
</style>
<main class="dotted">
  <div class="top">
    <span class="brand"><img src="icons/logo.svg" alt=""><span data-i18n="extName"></span></span>
    <span class="small faint" id="stepLabel" aria-live="polite"></span>
  </div>
  <div class="steps" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <!-- 1. welcome -->
  <section class="step" data-step="1">
    <div class="demo" aria-hidden="true">
      <div class="demo-scene"><span class="a"></span><span class="b"></span><span class="c"></span></div>
      <span class="demo-badge"><img src="icons/logo.svg" alt=""><span data-i18n="extName"></span><i></i></span>
      <div class="demo-subs" id="demoSubs">
        <div class="demo-line orig" id="demoOrig"></div>
        <div class="demo-line trans" id="demoTrans"></div>
      </div>
      <svg class="demo-cursor" id="demoCursor" viewBox="0 0 24 24"><path fill="currentColor" stroke="#000" stroke-width="1" d="M4 2l15 11-6.5 1.2L9 21z"/></svg>
      <div class="demo-bar">
        <svg viewBox="0 0 12 12"><path fill="currentColor" d="M2 1l9 5-9 5z"/></svg>
        <div class="demo-track"><span></span></div>
        <span>12:48</span>
      </div>
    </div>
    <h1 tabindex="-1" data-i18n="obTitle"></h1>
    <p class="lead" data-i18n="obWelcomeText"></p>
    <div class="features">
      <div class="card feature">
        <span class="feature-icon" style="background:rgba(255,213,74,.12);color:var(--hue-1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 15h4M14 15h3M7 11h10"/></svg>
        </span><span data-i18n="obFeature1"></span>
      </div>
      <div class="card feature">
        <span class="feature-icon" style="background:rgba(127,219,255,.12);color:var(--hue-2)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h8M8 3v2M5.5 5c.8 3 3 5.5 6.5 7M10.5 5c-.8 3-3 5.5-6.5 7"/><path d="M13 20l4-9 4 9M14.5 17h5"/></svg>
        </span><span data-i18n="obFeature2"></span>
      </div>
      <div class="card feature">
        <span class="feature-icon" style="background:rgba(255,158,181,.12);color:#ff9eb5">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        </span><span data-i18n="obFeature3"></span>
      </div>
    </div>
    <div class="nav"><span class="spacer"></span><button class="btn primary" data-next data-i18n="obStart"></button></div>
  </section>

  <!-- 2. languages and level -->
  <section class="step" data-step="2" hidden>
    <h2 tabindex="-1" data-i18n="obLangTitle"></h2>
    <p class="lead" data-i18n="obLangText"></p>
    <div class="two">
      <div><label class="field-label" for="targetLang" data-i18n="targetLangLabel"></label><select id="targetLang"></select></div>
      <div><label class="field-label" for="nativeLang" data-i18n="nativeLangLabel"></label><select id="nativeLang" aria-describedby="langError"></select></div>
    </div>
    <p id="langError" class="error-text" hidden data-i18n="sameLanguage"></p>
    <div>
      <span class="field-label" id="levelTitle" data-i18n="levelLabel"></span>
      <div class="grid levels" role="radiogroup" aria-labelledby="levelTitle" id="levels"></div>
      <p class="small faint" style="margin-top:8px" data-i18n="obLevelText"></p>
    </div>
    <div class="nav">
      <button class="btn secondary" data-back data-i18n="obBack"></button><span class="spacer"></span>
      <button class="btn primary" data-next id="langNext" data-i18n="obNext"></button>
    </div>
  </section>

  <!-- 3. AI provider and key -->
  <section class="step" data-step="3" hidden>
    <h2 tabindex="-1" data-i18n="obAiTitle"></h2>
    <p class="lead" data-i18n="obAiText"></p>
    <div class="grid providers" role="radiogroup" aria-label="AI" id="providers"></div>
    <div>
      <label class="field-label" for="apiKey" data-i18n="apiKeyLabel"></label>
      <div class="input-group">
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false">
        <button type="button" id="toggleKey" class="btn secondary" data-i18n="show"></button>
      </div>
    </div>
    <div class="key-row">
      <button type="button" class="btn secondary" id="verifyKey" data-i18n="obVerify"></button>
      <a id="getKey" target="_blank" rel="noopener" class="small" data-i18n="getKey"></a>
      <span id="keyStatus" class="key-status" role="status"></span>
    </div>
    <p class="small faint" data-i18n="footerPrivacy"></p>
    <div class="nav">
      <button class="btn secondary" data-back data-i18n="obBack"></button><span class="spacer"></span>
      <button class="btn secondary" data-next data-i18n="obSkip" id="skipKey"></button>
      <button class="btn primary" data-next data-i18n="obNext" id="aiNext"></button>
    </div>
  </section>

  <!-- 4. how to use -->
  <section class="step" data-step="4" hidden>
    <h2 tabindex="-1" data-i18n="obUseTitle"></h2>
    <ol class="howto">
      <li class="card" data-i18n="obUse1"></li>
      <li class="card" data-i18n="obUse2"></li>
      <li class="card" data-i18n="obUse3"></li>
      <li class="card" data-i18n="obUse4"></li>
    </ol>
    <div>
      <span class="field-label" id="modeTitle" data-i18n="obModeTitle"></span>
      <div class="grid modes" role="radiogroup" aria-labelledby="modeTitle">
        <label class="choice"><input type="radio" name="trMode" value="blur"><strong data-i18n="segBlur"></strong><span data-i18n="trModeBlur"></span></label>
        <label class="choice"><input type="radio" name="trMode" value="always"><strong data-i18n="segAlways"></strong><span data-i18n="trModeAlways"></span></label>
        <label class="choice"><input type="radio" name="trMode" value="click"><strong data-i18n="segClick"></strong><span data-i18n="trModeClick"></span></label>
      </div>
    </div>
    <div class="nav">
      <button class="btn secondary" data-back data-i18n="obBack"></button><span class="spacer"></span>
      <button class="btn primary" id="finish" data-i18n="obFinish"></button>
    </div>
  </section>

  <!-- done -->
  <section class="step finish" data-step="5" hidden>
    <div class="finish-mark" aria-hidden="true">
      <svg viewBox="0 0 80 80">
        <defs><linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd54a"/><stop offset="1" stop-color="#7fdbff"/></linearGradient></defs>
        <circle class="ring" cx="40" cy="40" r="34"/><path class="tick" d="M27 41l9 9 18-19"/>
      </svg>
      <span class="burst" id="burst"></span>
    </div>
    <h2 tabindex="-1" data-i18n="obDoneTitle"></h2>
    <p class="lead" data-i18n="obDoneText"></p>
    <div class="nav">
      <a class="btn secondary" href="options.html" data-i18n="settings"></a>
      <button class="btn primary" id="close" data-i18n="obClose"></button>
    </div>
  </section>
</main>
<script src="settings.js"></script>
<script src="onboarding.js"></script>
</html>
