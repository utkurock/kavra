<!doctype html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>optionsTitle</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { max-width: 760px; margin: 0 auto; padding: 36px 16px 80px; }
  .page-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
  section.card { padding: 4px 20px; margin-bottom: 16px; }
  section h2 { font-size: 15px; font-weight: 650; padding: 16px 0 4px; }
  section > .section-help { padding-bottom: 8px; }
  .field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 8px 24px; align-items: center;
    padding: 16px 0; border-top: 1px solid var(--line); }
  section h2 + .field, section .section-help + .field { border-top: 0; }
  .field label, .field .label { font-weight: 600; display: block; }
  .field .help { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .field.wide { grid-template-columns: 1fr; }
  .field .end { justify-self: end; }
  .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .choice { position: relative; display: block; padding: 12px; border: 1px solid var(--line-strong); border-radius: 10px; cursor: pointer; }
  .choice:hover { border-color: var(--muted); }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice strong { display: block; font-size: 13.5px; }
  .choice span { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error-text { color: var(--bad); font-size: 13px; margin-top: 6px; }
  @media (max-width: 640px) {
    .field { grid-template-columns: 1fr; }
    .field .end { justify-self: start; }
    .choices { grid-template-columns: 1fr; }
  }
</style>
<main>
  <header class="page-head">
    <span class="brand lg"><img src="icons/logo.svg" alt=""><span data-i18n="extName"></span></span>
    <p class="muted" data-i18n="optionsSubtitle"></p>
  </header>

  <form id="form" novalidate>
    <section class="card">
      <h2 data-i18n="secLanguages"></h2>
      <p class="muted small section-help" data-i18n="secLanguagesHelp"></p>
      <div class="field">
        <div><label for="targetLang" data-i18n="targetLangLabel"></label><p class="help" data-i18n="targetLangHelp"></p></div>
        <select id="targetLang"></select>
      </div>
      <div class="field">
        <div><label for="nativeLang" data-i18n="nativeLangLabel"></label><p class="help" data-i18n="nativeLangHelp"></p></div>
        <div>
          <select id="nativeLang" aria-describedby="langError"></select>
          <p id="langError" class="error-text" hidden data-i18n="sameLanguage"></p>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="secApi"></h2>
      <div class="field wide">
        <div><label for="apiKey" data-i18n="apiKeyLabel"></label><p class="help" data-i18n="apiKeyHelp"></p></div>
        <div class="input-group">
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
          <button type="button" id="toggleKey" class="btn secondary" data-i18n="show"></button>
        </div>
        <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" class="small" data-i18n="getKey"></a>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="secSubtitles"></h2>
      <div class="field">
        <div><label for="source" data-i18n="sourceLabel"></label><p class="help" data-i18n="sourceHelp"></p></div>
        <select id="source">
          <option value="auto" data-i18n="sourceAuto"></option>
          <option value="page" data-i18n="sourcePage"></option>
          <option value="speech" data-i18n="sourceSpeech"></option>
        </select>
      </div>
      <div class="field wide">
        <div><span class="label" id="trModeTitle" data-i18n="trModeLabel"></span><p class="help" data-i18n="trModeHelp"></p></div>
        <div class="choices" role="radiogroup" aria-labelledby="trModeTitle">
          <label class="choice"><input type="radio" name="trMode" value="blur"><strong data-i18n="segBlur"></strong><span data-i18n="trModeBlur"></span></label>
          <label class="choice"><input type="radio" name="trMode" value="always"><strong data-i18n="segAlways"></strong><span data-i18n="trModeAlways"></span></label>
          <label class="choice"><input type="radio" name="trMode" value="click"><strong data-i18n="segClick"></strong><span data-i18n="trModeClick"></span></label>
        </div>
      </div>
      <div class="field">
        <div><label for="framesPerm" data-i18n="framesLabel"></label><p class="help" data-i18n="framesHelp"></p></div>
        <input type="checkbox" role="switch" class="switch end" id="framesPerm">
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="secQuiz"></h2>
      <div class="field">
        <div><label for="quizMinutes" data-i18n="quizMinutesLabel"></label><p class="help" data-i18n="quizMinutesHelp"></p></div>
        <div class="suffix"><input id="quizMinutes" type="number" min="3" max="180" step="1"><span data-i18n="minUnit"></span></div>
      </div>
      <div class="field">
        <div><label for="level" data-i18n="levelLabel"></label><p class="help" data-i18n="levelHelp"></p></div>
        <select id="level"></select>
      </div>
    </section>
  </form>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="settings.js"></script>
<script src="options.js"></script>
</html>
