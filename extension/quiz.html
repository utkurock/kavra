<!doctype html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quizzesTitle</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* questions as a grid of cards, progress and result in a panel beside them */
  .qlayout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; align-items: start; }
  .qlayout.solo, .qlayout.solo #list { grid-template-columns: minmax(0, 1fr); }
  .qside { position: sticky; top: calc(var(--topbar-h) + 20px); display: grid; gap: 20px; }
  .qside .card { padding: 20px 22px; }
  .qside h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .progress-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; font-size: 13.5px; }
  @media (max-width: 1000px) {
    .qlayout { grid-template-columns: minmax(0, 1fr); }
    .qside { order: -1; top: var(--topbar-h); z-index: 1; }
    #list { grid-template-columns: minmax(0, 1fr); }
  }
  .q { margin: 0; padding: 22px 24px; }
  /* question kind: a coloured dot and a quiet label */
  .kind { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; color: var(--muted); --dot: var(--fg); }
  .kind::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot); }
  .kind.vocabulary { --dot: var(--hue-1); }
  .kind.listening, .kind.fill { --dot: var(--hue-2); }
  .kind.translation { --dot: #ff9eb5; }
  .question { font-size: 17.5px; font-weight: 600; margin: 12px 0 6px; line-height: 1.45; }
  .quote { color: var(--muted); font-style: italic; border-left: 3px solid var(--line-strong); padding-left: 10px; margin: 8px 0 12px; }
  .options { display: grid; gap: 8px; margin-top: 12px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: var(--fg);
    padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer;
    transition: border-color .15s, background-color .15s; }
  .opt:hover:not(:disabled) { border-color: var(--muted); background: var(--surface-2); }
  .opt:disabled { cursor: default; }
  .opt .letter { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px;
    background: var(--surface-2); font-weight: 700; font-size: 13px; color: var(--muted); }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.correct .letter { background: var(--ok); color: var(--surface); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .letter { background: var(--bad); color: var(--surface); }
  .opt.faded { opacity: .55; }
  .exp { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
  .exp strong { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
  .exp.ok strong { color: var(--ok); }
  .exp.bad strong { color: var(--bad); }
  .summary { text-align: center; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .summary .big { font-size: 44px; font-weight: 750; letter-spacing: -.03em; line-height: 1; }
  .empty { text-align: center; padding: 48px 20px; }
  /* overview: every quiz as a card that opens it */
  .qcards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .qcard { display: flex; flex-direction: column; gap: 6px; height: 100%; padding: 18px 20px 16px; color: var(--fg);
    text-decoration: none; transition: border-color .15s, background-color .15s; }
  .qcard:hover { border-color: var(--line-strong); background: color-mix(in srgb, var(--surface-2) 50%, var(--surface)); }
  .qcard-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .qcard-top .when { font-size: 12.5px; color: var(--faint); white-space: nowrap; }
  .qcard-title { font-size: 16px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .qcard-sub { font-size: 13px; color: var(--muted); }
  .qcard-foot { display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 16px; font-size: 12.5px; color: var(--muted); }
  .qcard-foot .progress { flex: 1; height: 4px; }
  .qcard-foot .tag.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .qcard-foot .tag.new { color: var(--hue-2); border-color: color-mix(in srgb, var(--hue-2) 40%, transparent); }
  .back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; font-size: 13.5px; color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--fg); }
</style>
<main>
  <div id="overview" hidden>
    <header class="page-title">
      <h1 data-i18n="quizzesTitle"></h1>
      <p class="muted" data-i18n="quizzesSubtitle"></p>
      <div class="actions"><a class="btn secondary" href="words.html" data-i18n="navWords"></a></div>
    </header>
    <div class="segtabs" role="tablist">
      <button class="segtab" role="tab" data-tab="all" aria-selected="true"><span data-i18n="wordsTabAll"></span><span class="count"></span></button>
      <button class="segtab" role="tab" data-tab="open" aria-selected="false"><span data-i18n="quizzesTabOpen"></span><span class="count"></span></button>
      <button class="segtab" role="tab" data-tab="done" aria-selected="false"><span data-i18n="quizzesTabDone"></span><span class="count"></span></button>
    </div>
    <ul id="quizList" class="qcards"></ul>
    <div id="quizzesEmpty" class="empty-state" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/></svg>
      <p data-i18n="quizzesEmpty"></p>
    </div>
  </div>

  <div id="detail" hidden>
  <a class="back-link" href="quiz.html" data-i18n="backToQuizzes"></a>
  <header class="page-title">
    <h1 id="title"></h1>
    <p class="muted" id="meta"></p>
  </header>
  <div class="qlayout">
    <div id="list"></div>
    <aside class="qside">
      <section class="card" id="progressWrap" hidden>
        <div class="progress-head"><span id="progressText"></span><span id="scoreText" class="muted"></span></div>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBar"><span></span></div>
      </section>
      <section id="summary" class="card summary" hidden>
        <span class="card-title" data-i18n="quizComplete"></span>
        <span class="big" id="summaryScore"></span>
        <p class="muted" id="summaryText"></p>
        <button id="back" class="btn primary" hidden data-i18n="backToVideo"></button>
        <p class="small muted" id="backError" hidden data-i18n="videoTabClosed"></p>
      </section>
    </aside>
  </div>
  </div>
</main>
<script src="settings.js"></script>
<script src="charts.js"></script>
<script src="nav.js"></script>
<script src="quiz.js"></script>
</html>
