<!doctype html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quizTitle</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { max-width: 680px; margin: 28px auto 60px; padding: 0 16px; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 14px 0; }
  .kind { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .question { font-size: 16px; font-weight: 600; margin: 4px 0 6px; }
  .quote { color: var(--muted); font-style: italic; margin: 0 0 10px; }
  .opt { display: block; width: 100%; text-align: left; margin: 6px 0; }
  .opt.correct { border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .opt.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
  .exp { margin-top: 8px; }
  #score { font-size: 16px; font-weight: 600; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
</style>
<main>
  <h1 data-i18n="quizTitle"></h1>
  <p class="muted" id="meta"></p>
  <div id="list"></div>
  <div class="bar">
    <span id="score" role="status"></span>
    <button id="back" class="primary" hidden data-i18n="backToVideo"></button>
  </div>
</main>
<script src="settings.js"></script>
<script src="quiz.js"></script>
</html>
