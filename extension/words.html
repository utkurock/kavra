<!doctype html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>navWords</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { max-width: 880px; }
  .toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .search { position: relative; flex: 1; }
  .search svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%);
    color: var(--faint); pointer-events: none; }
  .search input { padding-left: 36px; }
  .toolbar .count { color: var(--faint); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .quiz-status { margin: 0 0 14px; color: var(--muted); }
  .quiz-status.bad { color: var(--bad); }
  /* saved lines as rows of one list: the line and its translation, then notes; date and source on the right */
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .words { list-style: none; margin: 0; padding: 0; }
  .word { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 24px;
    padding: 18px 20px; border-top: 1px solid var(--line); animation: word-in .2s ease both;
    transition: opacity .18s ease, transform .18s ease, background-color .12s; }
  .word:first-child { border-top: 0; }
  .word:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
  .word.leaving { opacity: 0; transform: translateX(-8px); }
  @keyframes word-in { from { opacity: 0; transform: translateY(4px); } }
  .w-body { grid-column: 1; min-width: 0; }
  .w-orig { font-size: 15.5px; font-weight: 600; line-height: 1.45; }
  .w-trans { color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .word ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); }
  .word li { padding-left: 12px; border-left: 2px solid var(--line-strong); }
  .word li b { color: var(--fg); font-weight: 600; }
  .w-side { grid-column: 2; display: flex; align-items: flex-start; gap: 6px; }
  .w-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-top: 2px;
    font-size: 12.5px; color: var(--faint); white-space: nowrap; }
  .w-meta a { color: inherit; text-decoration: none; }
  .w-meta a:hover { color: var(--muted); text-decoration: underline; }
  .remove { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; border: 0;
    background: none; color: var(--faint); cursor: pointer; transition: background-color .15s, color .15s, opacity .15s; }
  .remove:hover { background: var(--bad-soft); color: var(--bad); }
  .remove svg { width: 16px; height: 16px; }
  @media (hover: hover) {
    .remove { opacity: 0; }
    .word:hover .remove, .remove:focus-visible { opacity: 1; }
  }
  .toast button { font: inherit; font-weight: 600; color: var(--hue-2); background: none; border: 0; padding: 0 0 0 10px;
    cursor: pointer; pointer-events: auto; }
  .toast.show { pointer-events: auto; }
  @media (max-width: 560px) {
    .word { grid-template-columns: minmax(0, 1fr); }
    .w-side { grid-column: 1; justify-content: space-between; }
    .w-meta { flex-direction: row; gap: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .word { animation: none; } }
</style>
<main>
  <header class="page-title">
    <h1 data-i18n="navWords"></h1>
    <p class="muted" data-i18n="wordsSubtitle"></p>
    <div class="actions"><button id="quiz" class="btn primary" data-i18n="wordQuizButton"></button></div>
  </header>
  <p id="quizStatus" class="small quiz-status" role="status" hidden></p>
  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search" data-i18n-placeholder="wordsSearch" data-i18n-aria-label="wordsSearch">
    </label>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <div class="list">
    <ul id="list" class="words"></ul>
    <div id="empty" class="empty-state" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7.5h6"/></svg>
      <p id="emptyText"></p>
    </div>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="settings.js"></script>
<script src="nav.js"></script>
<script src="words.js"></script>
</html>
