<!doctype html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>navWords</title>
<link rel="stylesheet" href="shared.css">
<style>
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 80px; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .toolbar input { flex: 1; }
  .toolbar .count { color: var(--faint); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .words { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .word { position: relative; padding: 16px 52px 14px 20px; animation: word-in .2s ease both;
    transition: opacity .18s ease, transform .18s ease; }
  .word.leaving { opacity: 0; transform: translateX(-8px); }
  @keyframes word-in { from { opacity: 0; transform: translateY(4px); } }
  .word .w-orig { font-size: 17px; font-weight: 650; line-height: 1.4; }
  .word .w-trans { color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .word ul { margin: 10px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
  .word li + li { margin-top: 3px; }
  .word li b { color: var(--fg); font-weight: 600; }
  .word .w-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12.5px; color: var(--faint); }
  .word .w-meta a { color: inherit; }
  .word .w-meta a:hover { color: var(--muted); }
  .word .remove { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; display: grid; place-items: center;
    border-radius: 8px; border: 1px solid transparent; background: none; color: var(--faint); cursor: pointer;
    transition: background-color .15s, color .15s, border-color .15s; }
  .word .remove:hover { background: var(--bad-soft); color: var(--bad); border-color: rgba(244, 124, 124, .2); }
  .word .remove:focus-visible { outline: 2px solid var(--hue-2); }
  .word .remove svg { width: 16px; height: 16px; }
  .empty { padding: 28px 20px; text-align: center; color: var(--muted); }
  .toast button { font: inherit; font-weight: 600; color: var(--hue-2); background: none; border: 0; padding: 0 0 0 10px;
    cursor: pointer; pointer-events: auto; }
  .toast.show { pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { .word { animation: none; } }
</style>
<main>
  <header class="page-title">
    <h1 data-i18n="navWords"></h1>
    <p class="muted" data-i18n="wordsSubtitle"></p>
  </header>
  <div class="toolbar">
    <input type="search" id="search" data-i18n-placeholder="wordsSearch" data-i18n-aria-label="wordsSearch">
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <ul id="list" class="words"></ul>
  <p id="empty" class="card empty" hidden></p>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="settings.js"></script>
<script src="nav.js"></script>
<script src="words.js"></script>
</html>
