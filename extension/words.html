<!doctype html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>navWords</title>
<link rel="stylesheet" href="shared.css">
<style>

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .toolbar .segtabs { margin: 0; }
  .search { position: relative; width: min(320px, 100%); }
  .search svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%);
    color: var(--faint); pointer-events: none; }
  .search input { padding-left: 36px; }
  .quiz-status { margin: 0 0 14px; color: var(--muted); }
  .quiz-status.bad { color: var(--bad); }
  /* saved lines as a grid of cards */
  .wgrid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .wcard { display: flex; flex-direction: column; gap: 6px; padding: 18px 20px 14px; animation: word-in .2s ease both;
    transition: opacity .18s ease, transform .18s ease, border-color .15s; }
  .wcard:hover { border-color: var(--line-strong); }
  .wcard.leaving { opacity: 0; transform: scale(.98); }
  @keyframes word-in { from { opacity: 0; transform: translateY(4px); } }
  .wcard-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; min-height: 22px; }
  .wcard-top .when { margin-left: auto; font-size: 12.5px; color: var(--faint); white-space: nowrap; }
  .w-orig { font-size: 16px; font-weight: 600; line-height: 1.45; }
  .w-trans { color: var(--muted); line-height: 1.45; }
  .w-notes { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .w-notes li { padding-left: 10px; border-left: 2px solid var(--line-strong); }
  .w-notes b { color: var(--fg); font-weight: 600; }
  .wcard-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto;
    padding-top: 14px; font-size: 12.5px; color: var(--faint); }
  .wcard-foot .actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .wcard-foot .tag { text-decoration: none; transition: color .15s, border-color .15s; }
  .wcard-foot .tag:hover { color: var(--fg); border-color: var(--muted); }
  .remove { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; border: 0;
    background: none; color: var(--faint); cursor: pointer; transition: background-color .15s, color .15s, opacity .15s; }
  .remove:hover { background: var(--bad-soft); color: var(--bad); }
  .remove svg { width: 15px; height: 15px; }
  @media (hover: hover) {
    .remove { opacity: 0; }
    .wcard:hover .remove, .remove:focus-visible { opacity: 1; }
  }
  .empty-state { border: 1px dashed var(--line-strong); border-radius: var(--radius); }
  .toast button { font: inherit; font-weight: 600; color: var(--hue-2); background: none; border: 0; padding: 0 0 0 10px;
    cursor: pointer; pointer-events: auto; }
  .toast.show { pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { .wcard { animation: none; } }
</style>
<main>
  <header class="page-title">
    <h1 data-i18n="navWords"></h1>
    <p class="muted" data-i18n="wordsSubtitle"></p>
    <div class="actions"><button id="quiz" class="btn primary" data-i18n="wordQuizButton"></button></div>
  </header>
  <p id="quizStatus" class="small quiz-status" role="status" hidden></p>
  <div class="toolbar">
    <div class="segtabs" role="tablist">
      <button class="segtab" role="tab" data-tab="all" aria-selected="true"><span data-i18n="wordsTabAll"></span><span class="count"></span></button>
      <button class="segtab" role="tab" data-tab="notes" aria-selected="false"><span data-i18n="wordsTabNotes"></span><span class="count"></span></button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search" data-i18n-placeholder="wordsSearch" data-i18n-aria-label="wordsSearch">
    </label>
  </div>
  <ul id="list" class="wgrid"></ul>
  <div id="empty" class="empty-state" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7.5h6"/></svg>
    <p id="emptyText"></p>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="settings.js"></script>
<script src="charts.js"></script>
<script src="nav.js"></script>
<script src="words.js"></script>
</html>
