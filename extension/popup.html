<!doctype html>
<html>
<meta charset="utf-8">
<title>extName</title>
<link rel="stylesheet" href="shared.css">
<style>
  html, body { overflow: hidden; }
  body { width: 360px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 20px 18px 10px; }
  .tabs { margin: 0 18px; }
  /* All panels share one grid cell, so switching tabs never changes the popup's size. */
  .panels { display: grid; position: relative; }
  .panel { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 14px; padding: 16px 18px 18px; }
  .panel[inert] { visibility: hidden; }
  .lang-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .stat .progress { margin-top: 10px; }
  .stats.three { grid-template-columns: repeat(3, 1fr); }
  .stats.three .stat { padding: 12px 12px 11px; }
  .stats.three .num { font-size: 22px; }
  .stats.three .lbl { font-size: 12px; }
  .panel .footer { margin: auto -18px -18px; }
  #heatmap { --cell: 15px; }
  /* language sheet slides over the panels */
  .sheet { position: absolute; inset: 0; z-index: 2; background: var(--bg); padding: 16px 18px 18px;
    display: flex; flex-direction: column; gap: 12px; }
  .sheet label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .sheet .actions { margin-top: auto; }
  .error-text { color: var(--bad); font-size: 13px; }
</style>
<div class="dotted">
  <header>
    <span class="brand"><img src="icons/logo.svg" alt=""><span data-i18n="extName"></span><span class="version" id="version"></span></span>
    <span id="status" class="pill"><span class="dot"></span><span id="statusText"></span></span>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-overview" aria-controls="panel-overview" aria-selected="true" data-i18n="tabOverview"></button>
    <button class="tab" role="tab" id="tab-activity" aria-controls="panel-activity" aria-selected="false" tabindex="-1" data-i18n="tabActivity"></button>
    <button class="tab" role="tab" id="tab-prefs" aria-controls="panel-prefs" aria-selected="false" tabindex="-1" data-i18n="tabPreferences"></button>
  </div>
</div>

<div class="panels">
  <section class="panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">
    <div class="lang-row">
      <span id="pair" class="chip"></span>
      <button id="changeLang" class="link-btn small muted" data-i18n="changeLanguages" aria-haspopup="dialog"></button>
    </div>
    <button id="toggle" class="btn primary block"></button>
    <div id="notice" class="callout" role="status" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/></svg>
      <span><span id="noticeText"></span> <button id="addKey" class="link-btn" hidden data-i18n="addKey" aria-haspopup="dialog"></button></span>
    </div>
    <div class="stats">
      <div class="stat"><span class="num" id="statMinutes">0</span><span class="lbl" data-i18n="statMinutes"></span></div>
      <div class="stat"><span class="num" id="statLines">0</span><span class="lbl" data-i18n="statLines"></span></div>
      <div class="stat"><span class="num hue-1" id="statLookedUp">0</span><span class="lbl" data-i18n="statLookedUp"></span></div>
      <div class="stat">
        <span class="num hue-2" id="statQuizIn">0</span><span class="lbl" id="statQuizLabel"></span>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="quizBar"><span></span></div>
      </div>
    </div>
    <button id="quizNow" class="btn secondary block" data-i18n="quizNow"></button>
  </section>

  <section class="panel" id="panel-activity" role="tabpanel" aria-labelledby="tab-activity" inert>
    <div class="row between">
      <span class="card-title" data-i18n="lastWeeks"></span>
      <a href="activity.html" target="_blank" class="small" data-i18n="seeAllActivity"></a>
    </div>
    <div id="heatmap" class="heatmap" role="img"></div>
    <div class="hm-legend" aria-hidden="true">
      <span data-i18n="less"></span><i class="hm-cell" data-level="0"></i><i class="hm-cell" data-level="1"></i><i class="hm-cell" data-level="2"></i><i class="hm-cell" data-level="3"></i><i class="hm-cell" data-level="4"></i><span data-i18n="more"></span>
    </div>
    <div class="stats three">
      <div class="stat"><span class="num" id="actToday">0</span><span class="lbl" data-i18n="minToday"></span></div>
      <div class="stat"><span class="num hue-1" id="actStreak">0</span><span class="lbl" data-i18n="dayStreak"></span></div>
      <div class="stat"><span class="num hue-2" id="actAccuracy">–</span><span class="lbl" data-i18n="quizAccuracy"></span></div>
    </div>
  </section>

  <section class="panel" id="panel-prefs" role="tabpanel" aria-labelledby="tab-prefs" inert>
    <div class="stack" style="gap:10px">
      <div class="card-title" data-i18n="secProvider"></div>
      <div class="lang-row">
        <span class="chip"><span id="providerName"></span><span class="faint" id="keyState"></span></span>
        <button id="changeKey" class="link-btn small muted" data-i18n="changeLanguages" aria-haspopup="dialog"></button>
      </div>
    </div>
    <div class="stack" style="gap:10px">
      <div class="card-title" id="trModeTitle" data-i18n="trModeLabel"></div>
      <div class="seg" role="radiogroup" aria-labelledby="trModeTitle">
        <input type="radio" name="trMode" id="m-blur" value="blur"><label for="m-blur" data-i18n="segBlur"></label>
        <input type="radio" name="trMode" id="m-always" value="always"><label for="m-always" data-i18n="segAlways"></label>
        <input type="radio" name="trMode" id="m-click" value="click"><label for="m-click" data-i18n="segClick"></label>
      </div>
      <p class="faint small" id="trModeHint"></p>
    </div>
    <footer class="footer">
      <span data-i18n="footerPrivacy"></span>
      <nav>
        <button id="options" class="link-btn" data-i18n="settings"></button>
        <a href="https://github.com/utkurock/kavra" target="_blank" rel="noopener">GitHub ↗</a>
      </nav>
    </footer>
  </section>

  <section class="sheet" id="langSheet" role="dialog" aria-modal="true" aria-labelledby="langSheetTitle" hidden>
    <div class="card-title" id="langSheetTitle" data-i18n="secLanguages"></div>
    <div><label for="sheetTarget" data-i18n="targetLangLabel"></label><select id="sheetTarget"></select></div>
    <div><label for="sheetNative" data-i18n="nativeLangLabel"></label><select id="sheetNative"></select></div>
    <p id="sheetError" class="error-text" hidden data-i18n="sameLanguage"></p>
    <p class="faint small" data-i18n="secLanguagesHelp"></p>
    <div class="actions"><button id="sheetDone" class="btn primary block" data-i18n="done"></button></div>
  </section>

  <section class="sheet" id="keySheet" role="dialog" aria-modal="true" aria-labelledby="keySheetTitle" hidden>
    <div class="card-title" id="keySheetTitle" data-i18n="secProvider"></div>
    <div><label for="keyProvider" data-i18n="providerLabel"></label><select id="keyProvider"></select></div>
    <div>
      <label for="keyInput" data-i18n="apiKeyLabel"></label>
      <div class="input-group">
        <input id="keyInput" type="password" autocomplete="off" spellcheck="false">
        <button type="button" id="keyToggle" class="btn secondary" data-i18n="show"></button>
      </div>
    </div>
    <a id="keyLink" class="small" target="_blank" rel="noopener" data-i18n="getKey"></a>
    <p class="faint small" data-i18n="footerPrivacy"></p>
    <div class="actions row">
      <button id="keyCancel" class="btn secondary" style="flex:1" data-i18n="cancel"></button>
      <button id="keySave" class="btn primary" style="flex:1" data-i18n="saveKey"></button>
    </div>
  </section>
</div>
<script src="settings.js"></script>
<script src="heatmap.js"></script>
<script src="popup.js"></script>
</html>
