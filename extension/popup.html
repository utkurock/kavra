<!doctype html>
<html>
<meta charset="utf-8">
<title>extName</title>
<link rel="stylesheet" href="shared.css">
<style>
  html, body { overflow: hidden; }
  body { width: 360px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 20px 18px 10px; }
  .tabs { margin: 0 18px; }
  /* Both panels share one grid cell, so switching tabs never changes the popup's size. */
  .panels { display: grid; }
  .panel { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 14px; padding: 16px 18px 18px; }
  .panel[inert] { visibility: hidden; }
  .lang-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .stat .progress { margin-top: 10px; }
  .panel .footer { margin: auto -18px -18px; }
</style>
<div class="dotted">
  <header>
    <span class="brand"><img src="icons/logo.svg" alt=""><span data-i18n="extName"></span><span class="version" id="version"></span></span>
    <span id="status" class="pill"><span class="dot"></span><span id="statusText"></span></span>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-overview" aria-controls="panel-overview" aria-selected="true" data-i18n="tabOverview"></button>
    <button class="tab" role="tab" id="tab-prefs" aria-controls="panel-prefs" aria-selected="false" tabindex="-1" data-i18n="tabPreferences"></button>
  </div>
</div>

<div class="panels">
  <section class="panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">
    <div class="lang-row">
      <span id="pair" class="chip"></span>
      <button id="changeLang" class="link-btn small muted" data-i18n="changeLanguages"></button>
    </div>
    <button id="toggle" class="btn primary block"></button>
    <div id="notice" class="callout" role="status" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/></svg>
      <span><span id="noticeText"></span> <button id="addKey" class="link-btn" hidden data-i18n="openSettings"></button></span>
    </div>
    <div class="stats">
      <div class="stat"><span class="num" id="statMinutes">0</span><span class="lbl" data-i18n="statMinutes"></span></div>
      <div class="stat"><span class="num" id="statLines">0</span><span class="lbl" data-i18n="statLines"></span></div>
      <div class="stat"><span class="num hue-1" id="statLookedUp">0</span><span class="lbl" data-i18n="statLookedUp"></span></div>
      <div class="stat">
        <span class="num hue-2" id="statQuizIn">0</span><span class="lbl" id="statQuizLabel"></span>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="quizBar"><span></span></div>
      </div>
    </div>
    <button id="quizNow" class="btn secondary block" data-i18n="quizNow"></button>
  </section>

  <section class="panel" id="panel-prefs" role="tabpanel" aria-labelledby="tab-prefs" inert>
    <div class="stack" style="gap:10px">
      <div class="card-title" id="trModeTitle" data-i18n="trModeLabel"></div>
      <div class="seg" role="radiogroup" aria-labelledby="trModeTitle">
        <input type="radio" name="trMode" id="m-blur" value="blur"><label for="m-blur" data-i18n="segBlur"></label>
        <input type="radio" name="trMode" id="m-always" value="always"><label for="m-always" data-i18n="segAlways"></label>
        <input type="radio" name="trMode" id="m-click" value="click"><label for="m-click" data-i18n="segClick"></label>
      </div>
      <p class="faint small" id="trModeHint"></p>
    </div>
    <footer class="footer">
      <span data-i18n="footerPrivacy"></span>
      <nav>
        <button id="options" class="link-btn" data-i18n="settings"></button>
        <a href="https://github.com/utkurock/kavra" target="_blank" rel="noopener">GitHub ↗</a>
      </nav>
    </footer>
  </section>
</div>
<script src="settings.js"></script>
<script src="popup.js"></script>
</html>
